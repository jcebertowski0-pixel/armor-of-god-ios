# Codemagic CI config - builds the Armor of God iOS app in the cloud (no Mac needed)
# and publishes it to TestFlight, where it installs on your iPhone with NO review.
#
# Signing: the App Store Connect API key named "Codemagic" (uploaded once in
# Codemagic settings > Integrations > Developer Portal) authenticates with Apple,
# and the distribution certificate private key comes from the encrypted
# "code-signing" variable group. The App Store profile is created on the fly.
workflows:
  armor-of-god-ios:
    name: Armor of God iOS
    max_build_duration: 20
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      groups:
        - code-signing
    scripts:
      - name: Fetch code signing files from App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.freebirdapps.armorofgod \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the app
        script: |
          xcode-project build-ipa --project ArmorOfGod.xcodeproj --scheme ArmorOfGod
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
