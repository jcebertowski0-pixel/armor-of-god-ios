# Codemagic CI config — builds the Armor of God iOS app in the cloud (no Mac needed)
# and publishes it to TestFlight, where it installs on your iPhone with NO review.
#
# Signing is fully automatic now: Codemagic fetches the App Store Connect profile
# and certificate at build time using the App Store Connect API key integration.
# Nothing needs to be uploaded manually in the Codemagic UI.
workflows:
  armor-of-god-ios:
    name: Armor of God iOS
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Fetch code signing files from App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.freebirdapps.armorofgod \
            --type APP_STORE --create
          xcode-project use-profiles
      - name: Build the app
        script: |
          xcode-project build-ipa --project ArmorOfGod.xcodeproj --scheme ArmorOfGod
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
