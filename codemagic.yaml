# Codemagic CI config - builds the Armor of God iOS app in the cloud (no Mac needed)
# and publishes it to TestFlight, where it installs on your iPhone with NO review.
#
# Signing: the App Store Connect API key named "Codemagic" (uploaded once in
# Codemagic settings > Integrations > Developer Portal) authenticates with Apple,
# and the distribution certificate private key comes from the encrypted
# "code-signing" variable group. The App Store profile is created on the fly.
#
# NOTE (proven 2026-10-26): Apple's API ALWAYS rejects explicit assignment of an
# INTERNAL TestFlight group to a build ("Cannot add internal group to a build",
# 422) - this is permanent Apple behavior, not a race (builds 39/43/44 all failed,
# even with retries hours after processing). Internal testers receive builds
# AUTOMATICALLY once Apple finishes processing, so no group assignment is needed.
# That is why `beta_groups` was removed from publishing - its "Failure" flag was
# pure noise. The post-publish script verifies the real distribution state via
# BuildBetaDetails and adds What's New test info.
workflows:
  armor-of-god-ios:
    name: Armor of God iOS
    # Pushes do NOT trigger builds (no GitHub webhook is configured on the repo) -
    # Start new build must be clicked in the Codemagic dashboard.
    # 45, not 20: the post-publish step WAITS for Apple to finish processing
    # (up to 20 polls x 60s). At a 20 minute cap Codemagic killed the build while
    # that wait was still running (build #51 "Build timeout"), which threw away
    # the only proof the build reached internal testers.
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      groups:
        - code-signing
    scripts:
      - name: Fetch code signing files from App Store Connect
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.freebirdapps.armorofgod \
            --type IOS_APP_STORE --create
          keychain add-certificates
          # Export as a normal App Store build. The previous
          # --custom-export-options='{"testFlightInternalTestingOnly": true}'
          # flag made every uploaded build buildAudienceType INTERNAL_ONLY, which
          # is why App Store Connect disabled them all in the version's Build
          # section. Default export method for build-ipa is app-store.
          xcode-project use-profiles --code-signing-setup-verbose-logging
      - name: Set build number (real git commit count, un-capped from shallow clones)
        script: |
          # ROOT CAUSE (2026-10-29): Codemagic clones shallow, so
          # `git rev-list --count HEAD` was CAPPED AT 50. Builds #50, #51 and the
          # v1.5 build all got build number 50 - TestFlight saw a duplicate and
          # the verification step looked up the wrong ASC record. Unshallow first
          # so the count is the repo's real commit count.
          git fetch --unshallow --tags 2>/dev/null || git fetch --tags 2>/dev/null || true
          N=$(git rev-list --count HEAD)
          echo "Real commit count: $N (history: $(git rev-list --count HEAD), shallow: $(git rev-parse --is-shallow-repository))"
          echo "Setting CURRENT_PROJECT_VERSION to $N"
          echo "BUILD_NUM=$N" >> $CM_ENV
          perl -pi -e "s/CURRENT_PROJECT_VERSION = \d+/CURRENT_PROJECT_VERSION = $N/g" ArmorOfGod.xcodeproj/project.pbxproj
          grep CURRENT_PROJECT_VERSION ArmorOfGod.xcodeproj/project.pbxproj | head -2
      - name: Build the app
        script: |
          echo "=== DIAGNOSTICS: targets and schemes Xcode sees ==="
          xcodebuild -list -project ArmorOfGod.xcodeproj 2>&1 || true
          echo "=== DIAGNOSTICS: raw showBuildSettings (with destination) ==="
          xcodebuild -project ArmorOfGod.xcodeproj -scheme ArmorOfGod \
            -destination 'generic/platform=iOS' -showBuildSettings 2>&1 | head -40 || true
          echo "=== DIAGNOSTICS: raw showBuildSettings (no destination, like the tool) ==="
          xcodebuild -project ArmorOfGod.xcodeproj -scheme ArmorOfGod \
            -showBuildSettings 2>&1 | head -40 || true
          echo "=== Starting build-ipa ==="
          xcode-project build-ipa --project ArmorOfGod.xcodeproj --scheme ArmorOfGod
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # beta_groups REMOVED on purpose: Jake's group is an INTERNAL group and
        # Apple's API always rejects assigning builds to internal groups (422).
        # Internal testers get every processed build automatically - no action,
        # no beta review, no test-info requirement for distribution.
      scripts:
        - name: Verify TestFlight internal distribution for this build
          # Waits for Apple processing, prints BuildBetaDetails (internalBuildState
          # is the source of truth for internal availability), adds What's New info,
          # and re-checks. Never fails the build - diagnostics only.
          script: |
            N=${BUILD_NUM:-$(git rev-list --count HEAD)}
            echo "Waiting for App Store Connect to finish processing build number $N"
            ID=""
            for i in $(seq 1 20); do
              J=$(app-store-connect builds list --build-version-number "$N" --json 2>/dev/null || echo "[]")
              ID=$(echo "$J" | jq -r '(if type=="array" then .[0].id elif type=="object" and has("data") then .data[0].id else null end) // empty')
              STATE=$(echo "$J" | jq -r '(if type=="array" then .[0].attributes.processingState elif type=="object" and has("data") then .data[0].attributes.processingState else null end) // empty')
              echo "poll $i: id=${ID:-not found} state=${STATE:-unknown}"
              if [ -n "$ID" ] && [ "$STATE" = "VALID" ]; then break; fi
              sleep 60
            done
            if [ -z "$ID" ]; then
              echo "WARNING: build $N not found on App Store Connect within timeout"
              exit 0
            fi
            echo "=== Build $N full record (check usesNonExemptEncryption) ==="
            echo "$J" | jq . 2>/dev/null || echo "$J"
            echo "=== BuildBetaDetails for THIS build ($N) ==="
            app-store-connect builds beta-details "$ID" --json || true
            echo "=== BuildBetaDetails for v1.4 build 43 (85d24871-a010-48dd-98db-d0a96efc287e) ==="
            app-store-connect builds beta-details 85d24871-a010-48dd-98db-d0a96efc287e --json || true
            echo "=== Adding What's New test info for build $N ==="
            app-store-connect builds add-beta-test-info "$ID" --locale en-US \
              --whats-new "Timer everywhere: a duration/lift/rest timer (30/3/2 min defaults) that stays visible, with voice cues and a blue rest phase. Lift now shows sets, reps and weight with previous week history and Lifting Progress. Chef guides you step by step with ingredient quantities, a prep checklist and minute/second timers. Birthdays list the month and day, with an optional birth year. Daily Acknowledgment includes upcoming events and birthdays." || true
            echo "=== BuildBetaDetails for THIS build after test info ==="
            app-store-connect builds beta-details "$ID" --json || true
            echo "DIAGNOSTICS DONE - internalBuildState above is the source of truth"
            echo
            echo "=== APP STORE READINESS DIAGNOSTICS (read-only, never fails) ==="
            echo "--- app-store-connect CLI surface ---"
            app-store-connect --help 2>&1 | sed -n '1,90p' || true
            echo "--- apps subcommands ---"
            app-store-connect apps --help 2>&1 | sed -n '1,60p' || true
            echo "--- app-store-versions subcommands ---"
            app-store-connect app-store-versions --help 2>&1 | sed -n '1,90p' || true
            echo "--- app-store-version-submissions subcommands ---"
            app-store-connect app-store-version-submissions --help 2>&1 | sed -n '1,90p' || true
            echo "--- app store versions for app 6821792871 ---"
            app-store-connect app-store-versions list --app 6821792871 --json 2>&1 | sed -n '1,220p' || true
            echo "=== END APP STORE READINESS DIAGNOSTICS ==="

  # Script-only workflow: App Store Connect admin queries and the review
  # submission itself, using the same "Codemagic" API key. No Xcode build, so it
  # costs a couple of minutes instead of a full build. Never touches billing,
  # agreements, or credentials - read and submit only.
  aog-asc-tools:
    name: AOG App Store Connect tools
    max_build_duration: 25
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
    scripts:
      - name: Set listing copy and submit for review
        script: |
          set +e
          APP=6821792871
          VID=7f03af6f-588e-4c73-b6e1-edc337727f4c
          LOC=03f3de21-af33-4448-909f-b3dc5563cc4f
          DESC="Armor of God is a Spartan-inspired training ground for your faith: a place to build physical discipline, spiritual resilience, and consistent daily habits. WHAT IS INSIDE - Oracle: ask a question and hear the answer spoken back to you. - Spartan Heart: daily reflections, acknowledgments, and scripture. - Spartan Chef: step-by-step cooking with quantities, a prep checklist and minute/second timers. - Lift: log sets, reps and weight, then review your history and lifting progress. - Routine, Strategy and Budget: keep your day, your plans and your money in order. - Calendar planner with alarms that get your attention: a reminder the day before and an hour before, full screen, with a swipe to acknowledge. - Voice: talk to the Oracle and Spartan Heart, plus Siri shortcuts such as asking Armor of God what your workout is. - Daily Acknowledgment that includes upcoming events and birthdays. Your armor is built one day at a time."
          KW="faith,devotion,scripture,prayer,spartan,workout,habits,discipline,daily,christian"
          PROMO="Timers everywhere, lift history with previous week numbers, a step-by-step Chef, and birthdays on your daily acknowledgment."
          echo "=== modify usage ==="
          app-store-connect app-store-version-localizations modify --help 2>&1 | sed -n '1,40p'
          echo "=== write listing copy ==="
          app-store-connect app-store-version-localizations modify "$LOC" --description "$DESC" --keywords "$KW" --support-url https://divine-armor-path.base44.app/AppInfo --marketing-url https://divine-armor-path.base44.app --promotional-text "$PROMO" --json 2>&1 | sed -n '1,40p'
          echo "=== read back ==="
          app-store-connect -s app-store-versions localizations "$VID" --json 2>&1 | grep -E '"(description|keywords|supportUrl|marketingUrl|promotionalText)"' | head -6
          echo "=== create review submission ==="
          SID=$(app-store-connect -s review-submissions create "$APP" --platform IOS --json 2>&1 | jq -r '.[0].id // .data[0].id // empty')
          echo "SUBMISSION=$SID"
          if [ -n "$SID" ]; then
            echo "=== add version item ==="
            app-store-connect review-submission-items create "$SID" --version-id "$VID" --json 2>&1 | tail -6
            echo "=== confirm (submit to App Review) ==="
            app-store-connect review-submissions confirm "$SID" --json > /tmp/confirm.out 2>&1
            echo "CONFIRM_EXIT=$?"
            cat /tmp/confirm.out
            echo "=== submission items ==="
            app-store-connect review-submissions items "$SID" --json 2>&1 | tail -8
          fi
          echo "=== final version state ==="
          app-store-connect -s app-store-versions get "$VID" --json 2>&1 | grep -E '"app(Store|Version)State"|"releaseType"'
          echo "=== END ==="
